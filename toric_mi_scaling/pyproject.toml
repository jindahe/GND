[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toric-mi-scaling"
version = "0.1.0"
description = "Toric-code mutual-information scaling with tensor networks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opt-einsum>=3.3", "matplotlib>=3.7"]

[project.optional-dependencies]
quimb = ["quimb>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]
